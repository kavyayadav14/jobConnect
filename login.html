<form id="login-form">

    <div class="form-group">

        <label for="login-email">
            Email
        </label>

        <input
            type="email"
            id="login-email"
            placeholder="Enter your email"
        >

    </div>


    <div class="form-group">

        <label for="login-password">
            Password
        </label>

        <input
            type="password"
            id="login-password"
            placeholder="Enter your password"
        >

    </div>


    <button
        type="submit"
        class="auth-btn"
    >
        Login
    </button>


    <p
        id="login-message"
        class="auth-message"
    ></p>

</form>

<script src="js/auth.js"></script>
