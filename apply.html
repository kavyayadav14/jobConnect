<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Job - JobConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================================
         NAVBAR
    ================================= -->

    <header class="navbar">

        <div class="logo">
            JobConnect
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="jobs.html">Jobs</a>
            <a href="applications.html">My Applications</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- ================================
         APPLICATION SECTION
    ================================= -->

    <section class="job-details-section">

        <div class="job-details-card">

            <h1>Apply for Job</h1>

            <p>
                Fill in the details below to submit your application.
            </p>


            <!-- ================================
                 APPLICATION FORM
            ================================= -->

            <form id="application-form">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="full-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        placeholder="Enter your full name"
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                    
                    >

                </div>


                <!-- Resume -->

                <div class="form-group">

                    <label for="resume">
                        Upload Resume
                    </label>

                    <input
                        type="file"
                        id="resume"
                        name="resume"
                        accept=".pdf,.doc,.docx"
                        
                    >

                </div>


                <!-- Cover Letter -->

                <div class="form-group">

                    <label for="cover-letter">
                        Cover Letter
                    </label>

                    <textarea
                        id="cover-letter"
                        name="coverLetter"
                        rows="6"
                        placeholder="Write a short cover letter..."
                    ></textarea>

                </div>


                <!-- Submit Button -->

                <button
                    type="submit"
                    class="apply-btn"
                >
                    Submit Application
                </button>


                <!-- Message -->

                <p id="application-message"></p>

            </form>

        </div>

    </section>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="footer">

        <p>
            © 2026 JobConnect. All Rights Reserved.
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
