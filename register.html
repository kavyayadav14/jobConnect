<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - JobConnect</title>

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="header">

        <div class="container">

            <div class="logo">
                <a href="index.html">
                    JobConnect
                </a>
            </div>

            <nav class="navbar">

                <a href="index.html">
                    Home
                </a>

                <a href="jobs.html">
                    Jobs
                </a>

                <a href="applications.html">
                    My Applications
                </a>

                <a href="login.html">
                    Login
                </a>

            </nav>

        </div>

    </header>


    <!-- ================================
         REGISTER SECTION
    ================================= -->

    <main class="auth-section">

        <div class="auth-container">

            <h1>
                Create Your Account
            </h1>

            <p class="auth-subtitle">
                Register to find and apply for jobs.
            </p>


            <form id="register-form">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your full name"
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="register-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Enter your password"
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Register
                </button>


                <p
                    id="register-message"
                    class="auth-message"
                ></p>

            </form>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <!-- ================================
         FOOTER
    ================================= -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 JobConnect. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
